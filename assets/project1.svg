<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 226" width="250" height="226">
<defs>
<filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="250" height="226">
  <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="3" seed="3" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rough2" filterUnits="userSpaceOnUse" x="0" y="0" width="250" height="226">
